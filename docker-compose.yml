
services:
  # MongoDB
  mongo:
    image: mongo:7
    container_name: docker-practice-mongo
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # Express Backend
  app:
    build:
      context: ./practice-docker
      dockerfile: Dockerfile

    container_name: express-app

    ports:
      - "5000:5000"

    env_file:
      - ./practice-docker/.env.docker

    depends_on:
      - mongo

    restart: unless-stopped

  # React Frontend
  todo-client:
    build:
      context: ./todo-client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api/v1

    container_name: todo-client

    ports:
      - "3007:80"

    depends_on:
      - app

    restart: unless-stopped

volumes:
  mongo_data: